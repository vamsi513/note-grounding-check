[project]
name = "note-grounding-check"
version = "0.1.0"
description = "Checks whether each sentence of a generated clinical style note is supported by its source conversation."
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
